name: queerloop
description: "QueerLoop+ — social app (user app + admin console)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  intl: any
  provider: ^6.1.5
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  video_player: ^2.9.2
  photo_manager: ^3.7.0
  share_plus: ^13.3.0
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  change_app_package_name: ^1.5.0
  firebase_core: ^4.15.0
  socket_io_client: ^3.1.6
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/welcome/
    - assets/images/communities/
    - assets/images/home/
    - assets/images/sample-users/
    - assets/images/discover/
    - assets/icons/
    - assets/animations/
    - assets/videos/

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
