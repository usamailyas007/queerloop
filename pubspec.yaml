name: queerloop
description: "QueerLoop+ — social app (user app + admin console)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  intl: any
  provider: ^6.1.5
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/welcome/
    - assets/images/communities/
    - assets/images/home/
    - assets/images/sample-users/
    - assets/images/discover/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
